services:
  backend:
    build: .
    container_name: voyage-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://voyage_user:voyage_pass@postgres:5432/voyage_db
    depends_on:
      - postgres
    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    image: postgres:16
    container_name: voyage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voyage_user
      POSTGRES_PASSWORD: voyage_pass
      POSTGRES_DB: voyage_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: voyage-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@voyage.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: voyage-minio
    restart: unless-stopped
    command: minio server /mnt/data --license /minio.license --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/mnt/data
      - ./minio/minio.license:/minio.license:ro

volumes:
  postgres_data:
  minio_data: